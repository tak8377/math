<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数学教材ダッシュボード｜試作版</title>
<style>
:root{color-scheme:light;--ink:#18283b;--muted:#5d7085;--bg:#f3f6fa;--card:#fff;--line:#dbe4ed;--accent:#175f9b;--pale:#eaf3fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.55}header{background:#173b5c;color:#fff;padding:26px max(20px,calc((100vw - 1100px)/2)) 22px}header h1{font-size:clamp(23px,4vw,34px);margin:0 0 4px}header p{margin:0;color:#d6e5f2;font-size:14px}.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.grades{display:flex;gap:6px;padding:5px;border:1px solid var(--line);background:white;border-radius:13px}.grades button{border:0;background:transparent;border-radius:9px;padding:10px 17px;font-weight:700;color:var(--muted);cursor:pointer}.grades button.active{background:var(--accent);color:#fff}.search{flex:1;min-width:210px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff}.note{background:#fff9e8;border:1px solid #ebdca8;border-radius:12px;padding:12px 16px;color:#675529;font-size:13px;margin-bottom:22px}.section{margin:0 0 28px}.sectionhead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}.sectionhead h2{font-size:22px;margin:0}.count{font-size:13px;color:var(--muted)}.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:14px}.lesson{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 3px 12px #18395a08}.lesson h3{font-size:17px;margin:0 0 4px}.lesson .sub{font-size:12px;color:var(--muted);margin-bottom:14px}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.links a{display:flex;align-items:center;justify-content:center;min-height:43px;text-align:center;text-decoration:none;border:1px solid #b8d3e8;background:#f1f7fc;color:#164d78;border-radius:9px;font-size:13px;font-weight:650;padding:8px 6px}.links a:hover,.links a:focus-visible{background:#dceefc;outline:2px solid #7cb2d9;outline-offset:1px}.links a.secondary{background:#fff;border-color:var(--line);color:#425b70}.links a.secondary:hover{background:#f2f6fa}.empty{background:white;border:1px dashed var(--line);border-radius:14px;padding:26px;color:var(--muted)}.smallprint{font-size:13px;color:var(--muted);margin-top:26px}footer{border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}@media(max-width:550px){.wrap{padding:17px 12px 40px}header{padding:23px 16px}.toolbar{align-items:stretch}.grades{width:100%}.grades button{flex:1}.search{width:100%}.sectionhead h2{font-size:20px}.lessons{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>数学教材ダッシュボード</h1><p>授業準備・印刷・投影にすぐアクセスするための教材置き場 ／ 試作版</p></header>
<main class="wrap">
  <div class="toolbar" aria-label="教材の絞り込み">
    <div class="grades" role="group" aria-label="学年"><button type="button" data-grade="all" class="active" aria-pressed="true">すべて</button><button type="button" data-grade="1" aria-pressed="false">中1</button><button type="button" data-grade="2" aria-pressed="false">中2</button></div>
    <input class="search" id="search" type="search" placeholder="単元名・教材名で検索" aria-label="教材を検索">
  </div>
  <div class="note">このページは試作版です。リンク先のファイルがGitHubにまだアップロードされていない場合は開けません。第5時も実ファイルの登録状況を確認してください。</div>
  <div id="catalog" aria-live="polite"></div>
  <p class="smallprint">※ 古い仮置きファイルや重複リンクは、今回の一覧には含めていません。元のファイルはこの試作によって削除されません。</p>
  <footer>試作版 v1 ｜ 既存の index.html を変更せずに確認できます。</footer>
</main>
<script>
'use strict';
// 教材の登録情報はここで管理します。見た目のHTMLを毎回コピーする必要はありません。
const materials = [
  ...[1,2,3,4,5].map(n => {
    const id = String(n).padStart(2,'0');
    const label = n <= 2 ? String(n) : id; // 実際のファイル名に合わせる
    const folder = `ch2_heiko_godo_${id}/`;
    return {grade:2,unit:'平行と合同',title:`第${n}時`,description:'授業用教材 4種類',links:[
      ['生徒用プリント',`${folder}01_第${label}時_生徒用プリント.pdf`],
      ['投影スライド',`${folder}02_第${label}時_投影スライド.pdf`],
      ['完成板書',`${folder}03_第${label}時_授業終了時の完成板書.pdf`],
      ['教師用メモ',`${folder}04_第${label}時_${n===1?'教師用進行メモ_解答監査':'教師用進行メモ'}.pdf`]
    ]};
  }),
  {grade:2,unit:'一次関数',title:'確認テスト',description:'問題・解説',links:[
    ['問題 PDF','一次関数_確認テスト_全4ページ_v15.pdf'],
    ['問題 DOCX','一次関数_確認テスト_全4ページ_v15.docx'],
    ['解説 PDF','1次関数_確認テスト_解説.pdf'],
    ['解説 PPTX','1次関数_確認テスト_解説.pptx']
  ]},
  {grade:2,unit:'連立方程式・一次関数',title:'整理ノート',description:'問題と解答',links:[
    ['問題 PDF','中2数学_連立方程式と一次関数_整理ノート_第3稿改.pdf'],
    ['問題 DOCX','中2数学_連立方程式と一次関数_整理ノート_第3稿改.docx'],
    ['解答 PDF','中2数学_連立方程式と一次関数_整理ノート_第3稿改_解答.pdf'],
    ['解答 DOCX','中2数学_連立方程式と一次関数_整理ノート_第3稿改_解答.docx']
  ]},
  {grade:1,unit:'テスト対策',title:'演習問題集',description:'問題と解答・解説',links:[
    ['問題 DOCX','中1数学_テスト対策_演習問題集_全12ページ版.docx'],
    ['解答 DOCX','中1数学_テスト対策_演習問題集_解答解説_全6ページ版.docx']
  ]}
];
const catalog = document.getElementById('catalog');
const search = document.getElementById('search');
let selectedGrade = 'all';
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
function render(){
  const q=search.value.trim().toLocaleLowerCase('ja');
  const items=materials.filter(m=>(selectedGrade==='all'||String(m.grade)===selectedGrade)&&(!q||[m.unit,m.title,m.description,...m.links.map(x=>x[0])].join(' ').toLocaleLowerCase('ja').includes(q)));
  catalog.replaceChildren();
  if(!items.length){catalog.append(el('div','empty','該当する教材がありません。'));return;}
  for(const grade of [2,1]){
    const group=items.filter(m=>m.grade===grade);if(!group.length)continue;
    const section=el('section','section');const head=el('div','sectionhead');head.append(el('h2','',`中学${grade}年`),el('span','count',`${group.length}件`));section.append(head);
    const units=[...new Set(group.map(m=>m.unit))];
    for(const unit of units){
      const unitHead=el('h3','',unit);unitHead.style.cssText='font-size:16px;margin:16px 0 10px;color:#456078';section.append(unitHead);
      const grid=el('div','lessons');
      for(const m of group.filter(x=>x.unit===unit)){
        const card=el('article','lesson');card.append(el('h3','',m.title),el('div','sub',m.description));
        const links=el('div','links');
        m.links.forEach(([label,url],i)=>{const a=el('a',i>=2?'secondary':'',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';links.append(a);});
        card.append(links);grid.append(card);
      }
      section.append(grid);
    }
    catalog.append(section);
  }
}
document.querySelectorAll('[data-grade]').forEach(button=>button.addEventListener('click',()=>{
  selectedGrade=button.dataset.grade;
  document.querySelectorAll('[data-grade]').forEach(b=>{const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
  render();
}));
search.addEventListener('input',render);
render();
</script>
</body>
</html>
